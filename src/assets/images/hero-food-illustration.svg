<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="spiceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e63946;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#ff7f11;stop-opacity:0.15" />
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="250" cy="250" r="240" fill="url(#spiceGrad)" filter="url(#softShadow)"/>
  
  <!-- Main plate -->
  <circle cx="250" cy="260" r="180" fill="none" stroke="#f5f5f0" stroke-width="3" opacity="0.6"/>
  <circle cx="250" cy="260" r="175" fill="none" stroke="#e63946" stroke-width="1" opacity="0.3" stroke-dasharray="5,5"/>
  
  <!-- Decorative spoon and fork -->
  <g transform="translate(200, 180) rotate(-25)">
    <line x1="0" y1="0" x2="0" y2="100" stroke="#ff7f11" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <circle cx="0" cy="105" r="4" fill="#ff7f11" opacity="0.4"/>
  </g>
  
  <g transform="translate(300, 180) rotate(25)">
    <line x1="0" y1="0" x2="0" y2="100" stroke="#e63946" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <circle cx="0" cy="105" r="4" fill="#e63946" opacity="0.4"/>
  </g>
  
  <!-- Food bowl illustration -->
  <g transform="translate(250, 240)">
    <!-- Bowl body -->
    <ellipse cx="0" cy="0" rx="90" ry="70" fill="none" stroke="#e63946" stroke-width="2.5" opacity="0.7"/>
    <!-- Bowl rim -->
    <path d="M -90 -70 Q -90 -85 0 -90 Q 90 -85 90 -70" fill="none" stroke="#ff7f11" stroke-width="2" opacity="0.6"/>
    
    <!-- Steam wisps -->
    <path d="M -30 -95 Q -25 -110 -20 -95" fill="none" stroke="#e63946" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
    <path d="M 0 -100 Q 5 -120 10 -100" fill="none" stroke="#ff7f11" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
    <path d="M 30 -95 Q 35 -110 40 -95" fill="none" stroke="#e63946" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
    
    <!-- Food texture inside bowl -->
    <circle cx="-40" cy="10" r="12" fill="#ff7f11" opacity="0.2"/>
    <circle cx="-10" cy="20" r="14" fill="#e63946" opacity="0.15"/>
    <circle cx="30" cy="15" r="13" fill="#ff7f11" opacity="0.18"/>
    <circle cx="50" cy="0" r="11" fill="#e63946" opacity="0.12"/>
  </g>
  
  <!-- Decorative leaves around edges -->
  <g opacity="0.3">
    <!-- Top left leaf -->
    <ellipse cx="120" cy="80" rx="8" ry="12" fill="none" stroke="#e63946" stroke-width="1.5" transform="rotate(-45 120 80)"/>
    <!-- Top right leaf -->
    <ellipse cx="380" cy="90" rx="8" ry="12" fill="none" stroke="#ff7f11" stroke-width="1.5" transform="rotate(45 380 90)"/>
    <!-- Bottom left leaf -->
    <ellipse cx="100" cy="420" rx="8" ry="12" fill="none" stroke="#ff7f11" stroke-width="1.5" transform="rotate(-30 100 420)"/>
    <!-- Bottom right leaf -->
    <ellipse cx="400" cy="420" rx="8" ry="12" fill="none" stroke="#e63946" stroke-width="1.5" transform="rotate(30 400 420)"/>
  </g>
  
  <!-- Fork details on left -->
  <g transform="translate(80, 250)">
    <line x1="0" y1="-30" x2="0" y2="30" stroke="#ff7f11" stroke-width="2" opacity="0.25" stroke-linecap="round"/>
    <circle cx="0" cy="-32" r="3" fill="#ff7f11" opacity="0.2"/>
    <circle cx="-8" cy="-15" r="2" fill="#e63946" opacity="0.15"/>
    <circle cx="8" cy="-15" r="2" fill="#e63946" opacity="0.15"/>
    <circle cx="0" cy="0" r="2" fill="#ff7f11" opacity="0.15"/>
  </g>
  
  <!-- Spoon details on right -->
  <g transform="translate(420, 270)">
    <path d="M 0 -20 L 0 25 Q 5 28 8 25" fill="none" stroke="#e63946" stroke-width="2" opacity="0.25" stroke-linecap="round"/>
    <ellipse cx="0" cy="30" rx="6" ry="8" fill="#e63946" opacity="0.15"/>
  </g>
  
  <!-- Center decorative circle -->
  <circle cx="250" cy="260" r="8" fill="#e63946" opacity="0.2"/>
  <circle cx="250" cy="260" r="4" fill="#ff7f11" opacity="0.3"/>
  
  <!-- Text-inspired decorative elements (dots pattern) -->
  <g opacity="0.2">
    <circle cx="150" cy="150" r="2" fill="#e63946"/>
    <circle cx="350" cy="160" r="2" fill="#ff7f11"/>
    <circle cx="140" cy="360" r="2" fill="#ff7f11"/>
    <circle cx="370" cy="350" r="2" fill="#e63946"/>
  </g>
</svg>
