<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="foodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e63946;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#ff7f11;stop-opacity:0.08" />
    </linearGradient>
    <filter id="shadowLight">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.06"/>
    </filter>
  </defs>
  
  <!-- Subtle background gradient -->
  <rect width="500" height="500" fill="url(#foodGrad)" opacity="0.5"/>
  
  <!-- Main plate base -->
  <circle cx="250" cy="270" r="160" fill="none" stroke="#f5f5f0" stroke-width="4" opacity="0.7"/>
  <circle cx="250" cy="270" r="155" fill="none" stroke="#e63946" stroke-width="1.2" opacity="0.2"/>
  
  <!-- Food bowl / container - main focus -->
  <g filter="url(#shadowLight)">
    <!-- Bowl outline -->
    <ellipse cx="250" cy="260" rx="110" ry="85" fill="none" stroke="#e63946" stroke-width="3" opacity="0.8"/>
    
    <!-- Bowl inner shadow / depth -->
    <ellipse cx="250" cy="250" rx="108" ry="12" fill="none" stroke="#ff7f11" stroke-width="1.5" opacity="0.3"/>
    
    <!-- Food content - clean circles representing ingredients -->
    <circle cx="220" cy="275" r="18" fill="#ff7f11" opacity="0.3"/>
    <circle cx="250" cy="295" r="22" fill="#e63946" opacity="0.25"/>
    <circle cx="280" cy="275" r="16" fill="#ff7f11" opacity="0.28"/>
    <circle cx="250" cy="260" r="14" fill="#e63946" opacity="0.2"/>
  </g>
  
  <!-- Left utensil - fork -->
  <g transform="translate(120, 290)">
    <line x1="0" y1="0" x2="0" y2="80" stroke="#e63946" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <!-- Fork prongs -->
    <line x1="-8" y1="80" x2="-8" y2="100" stroke="#e63946" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="0" y1="80" x2="0" y2="100" stroke="#e63946" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="8" y1="80" x2="8" y2="100" stroke="#e63946" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <!-- Handle accent -->
    <circle cx="0" cy="-5" r="4" fill="#e63946" opacity="0.5"/>
  </g>
  
  <!-- Right utensil - spoon -->
  <g transform="translate(380, 310)">
    <line x1="0" y1="0" x2="0" y2="75" stroke="#ff7f11" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <!-- Spoon bowl -->
    <ellipse cx="0" cy="82" rx="9" ry="12" fill="none" stroke="#ff7f11" stroke-width="2.5" opacity="0.7"/>
    <!-- Handle accent -->
    <circle cx="0" cy="-5" r="4" fill="#ff7f11" opacity="0.5"/>
  </g>
  
  <!-- Top accent line (representing steam or aroma) -->
  <g opacity="0.4">
    <path d="M 200 140 Q 210 120 220 140" fill="none" stroke="#e63946" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 250 130 Q 260 110 270 130" fill="none" stroke="#ff7f11" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 280 145 Q 290 125 300 145" fill="none" stroke="#e63946" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  
  <!-- Minimal decorative accent dots -->
  <g opacity="0.2">
    <circle cx="140" cy="200" r="1.5" fill="#e63946"/>
    <circle cx="360" cy="210" r="1.5" fill="#ff7f11"/>
    <circle cx="150" cy="380" r="1.5" fill="#ff7f11"/>
    <circle cx="350" cy="370" r="1.5" fill="#e63946"/>
  </g>
</svg>

